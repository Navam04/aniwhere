# Push a tag like v1.0.0 to publish that version: builds the Docker image for amd64 and arm64, pushes it to
# ghcr.io/<owner>/aniwhere as :1.0.0, :1.0 and :latest, and creates the GitHub release with the notes for that
# version from CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION matches the tag
        run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || { echo "VERSION is $(cat VERSION), tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$(cat VERSION)" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $(cat VERSION)"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aniwhere
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: softprops/action-gh-release@v2
        with:
          name: Aniwhere ${{ github.ref_name }}
          body_path: notes.md
