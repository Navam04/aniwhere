<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connecting AniList</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d12; color: #eef1f6;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; }
    .box { max-width: 420px; text-align: center; }
    a { color: #7c8cff; }
  </style>
</head>
<body>
  <div class="box"><p id="msg">Connecting your AniList account…</p></div>
  <script>
    (async () => {
      const msg = document.getElementById('msg');
      const params = new URLSearchParams(location.hash.slice(1));
      const token = params.get('access_token');
      history.replaceState(null, '', '/anilist/callback');
      if (!token) {
        msg.innerHTML = 'AniList didn\'t send a login token. <a href="/#/settings">Back to settings</a>';
        return;
      }
      try {
        const r = await fetch('/api/anilist/token', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ access_token: token }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || 'Connection failed');
        msg.textContent = `Connected as ${d.name}. Imported ${d.imported} list entries.`;
        setTimeout(() => location.replace('/#/settings'), 1200);
      } catch (e) {
        msg.textContent = e.message;
        msg.insertAdjacentHTML('beforeend', ' <a href="/#/settings">Back to settings</a>');
      }
    })();
  </script>
</body>
</html>
